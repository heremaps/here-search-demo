# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, release/* ]
  schedule:
    - cron: "0 8 * * *"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      # https://github.com/astral-sh/setup-uv
      # https://github.com/codecov/codecov-action
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Test
        run: |
          for version in 3.11 3.12 3.13 3.14; do
            uv run --python "$version" --extra dev pytest -n auto -vv tests --ignore=tests/test_notebooks.py
          done

      - name: Coverage
        run: |
          uv run --python 3.14 --extra dev pytest -v --cov=src tests --ignore=tests/test_notebooks.py --cov-report=xml --cov-report=term-missing

      - name: Upload to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  pages-build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/mamba-org/setup-micromamba
      # https://github.com/actions/upload-pages-artifact
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3

      - name: Create page
        run: |
          uv run --active ./lite-build.sh
          uv run --active --extra docs sphinx-build -b html docs/ workspace/public/docs
          ls -la
          ls -la workspace
          mv workspace/public .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: pages-build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    # GitHub disables scheduled workflows of a public repository after 60 days without
    # repository activity. Re-enabling this workflow on every scheduled run, through the
    # API, keeps it from being disabled. No commit is created.
    # https://docs.github.com/en/actions/managing-workflow-runs/disabling-and-enabling-a-workflow
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable test.yml --repo "$GITHUB_REPOSITORY"
